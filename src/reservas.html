<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Sistema de Equipamentos</title>
</head>
<body>
    <aside>
        <button id="menu-btn"><img src="images/menu.png" height="48px" onclick="menuButton()"></button> <!-- Icone / Botão do menu -->

        <div class="buttons">
            <div class="icone-label">
                <button class="menu-icon"><a href="/dashboard" class="a-menu-icon"><img src="images/home.png" height="48px"></a></button> <!-- Icone / Botão Ínicio -->
                <label id="text-label">Início</label>
            </div>
            
            <div class="icone-label">
                <button  class="menu-icon"><a href="/equipamentos" class="a-menu-icon"><img src="images/laptop-computer.png" height="48px"></a></button> <!-- Icone / Equipamentos -->
                <label id="text-label">Equipamentos</label>
            </div>
            
            <div class="icone-label">
                <button class="menu-icon"><a href="/reservas" class="a-menu-icon"><img src="images/calendar.png" height="48px"></a></button> <!-- Icone / Reservas -->
                <label id="text-label">Reservas</label>
            </div>
            
            <div class="icone-label">
                <button class="menu-icon"><a href="/devoluções" class="a-menu-icon"><img src="images/return.png" height="48px"></a></button> <!-- Icone / Devoluções -->
                <label id="text-label">Devoluções</label>
            </div>
            
            <div class="icone-label">
                <button class="menu-icon"><a href="/relatorios" class="a-menu-icon"><img src="images/docs.png" height="48px"></a></button> <!-- Icone / Relatórios -->  
                <label id="text-label">Relatórios</label>
            </div>
            
            <div class="icone-label">
                <button class="menu-icon"><a href="/configuracoes" class="a-menu-icon"><img src="images/settings.png" height="48px"></a></button> <!-- Icone / Configurações -->
                <label id="text-label">Configurações</label>
            </div>
            
        </div>

    </aside>

    <div class="background">
        <div class="search-div">
            <h1 id="title">Reservas</h1>
            <input id="search" type="search" placeholder="Pesquisar">
            <button id="filter"><img id="filter" src="images/filter.png"></button>
        </div>
        
        <button class="add-reservation" onclick="toggleAddReservation()">Adicionar</button>

        <div class="reservations-background">
            
        </div>
    </div>

    <!-- Hidden Menus -->

    <div class="all-add-background">
        <div class="add-background">
            <div class="line">
                <h2>Adicionar</h2>
                <button id="cancel" onclick="toggleAddReservation()">Cancelar</button>
            </div>
            
            <form id="add-form" class="add-reservation-form">
                <div class="line1">
                    <label for="name" class="line-label">Nome do Solicitante</label>
                    <input id="name" type="text" name="name" placeholder="Digite o nome do equipamento">
                </div>

                <div class="line1">
                    <label for="eq" class="line-label">Equipamento</label>
                    <input id="eq" list="equipments" name="eq" placeholder="Selecione o Equipamento">
                    <datalist id="equipments"></datalist>
                </div>

                <div class="line1">
                    <label for="initalDate" class="line-label">Data e Horário da Reserva</label>
                    <input id="initalDate" type="text" name="initalDate" placeholder="Digite a data e hora da reserva">
                </div>

                <div class="line1">
                    <label for="limitDate" class="line-label">Data e Horário de Devolução</label>
                    <input id="limitDate" type="text" name="limitDate" placeholder="Digite a data e hora de devolução">
                </div>

                <div class="line1">
                    <label for="obs" class="line-label">Observação</label>
                    <input id="obs" type="text" name="obs" placeholder="Observação                                     (Opcional)">
                </div>

                <div class="add-div">
                    <button class="add-equipment" id="add" type="submit">Adicionar</button>
                </div>
                
            </form>
        </div>
        
    </div>

    <footer>
        <img src="images/Logos - Sistema Fiep RGB_COR_SENAI.png" id="logo">
    </footer>

    <script src="scipts/reservas.js"></script>
    <script src="scipts/utils.js"></script>
</body>
</html>
