<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Sistema de Equipamentos</title>
</head>
<body>
    <aside>
        <button id="menu-btn"><img src="images/menu.png" height="48px" onclick="menuButton()"></button> <!-- Icone / Botão do menu -->

        <div class="buttons">
            <div class="icone-label">
                <button class="menu-icon"><a href="/dashboard" class="a-menu-icon"><img src="images/home.png" height="48px"></a></button> <!-- Icone / Botão Ínicio -->
                <label id="text-label">Início</label>
            </div>
            
            <div class="icone-label">
                <button  class="menu-icon"><a href="/equipamentos" class="a-menu-icon"><img src="images/laptop-computer.png" height="48px"></a></button> <!-- Icone / Equipamentos -->
                <label id="text-label">Equipamentos</label>
            </div>
            
            <div class="icone-label">
                <button class="menu-icon"><a href="/reservas" class="a-menu-icon"><img src="images/calendar.png" height="48px"></a></button> <!-- Icone / Reservas -->
                <label id="text-label">Reservas</label>
            </div>
            
            <div class="icone-label">
                <button class="menu-icon"><a href="/devolucoes" class="a-menu-icon"><img src="images/return.png" height="48px"></a></button> <!-- Icone / Devoluções -->
                <label id="text-label">Devoluções</label>
            </div>
            
            <div class="icone-label">
                <button class="menu-icon"><a href="/relatorios" class="a-menu-icon"><img src="images/docs.png" height="48px"></a></button> <!-- Icone / Relatórios -->  
                <label id="text-label">Relatórios</label>
            </div>
            
            <div class="icone-label">
                <button class="menu-icon"><a href="/configuracoes" class="a-menu-icon"><img src="images/settings.png" height="48px"></a></button> <!-- Icone / Configurações -->
                <label id="text-label">Configurações</label>
            </div>
            
        </div>

    </aside>

    <div class="background">
        <div class="search-div">
            <h1 id="title">Equipamentos</h1>
            <input id="search" type="search" placeholder="Pesquisar">
        </div>
        
        <button class="add-equipment" onclick="toggleAddMenu()">Adicionar</button>

        <div class="equipments-background">
            
        </div>
    </div>
    
    <div class="all-add-background">
        <div class="add-background">
            <div class="line">
                <h2>Adicionar</h2>
                <button id="cancel" onclick="toggleAddMenu()">Cancelar</button>
            </div>
            
            <form id="add-form" class="add-equipment-form">
                <div class="line1">
                    <label for="name" class="line-label">Nome do Equipamento</label>
                    <input id="name" type="text" name="name" placeholder="Digite o nome do equipamento">
                </div>

                <div class="line1">
                    <label for="desc" class="line-label">Descrição</label>
                    <input id="desc" type="text" name="desc" placeholder="Digite a descrição">
                </div>

                <div class="line1">
                    <label  class="line-label">Imagem</label>
                    <label for="file-input" class="custom-button">Escolher Imagem</label>
                    <input id="file-input" type="file" name="file-input" accept="image/*" style="display: none;">
                </div>

                <div class="add-div">
                    <button class="add-equipment" id="add" type="submit">Adicionar</button>
                </div>
                
            </form>
        </div>
        
    </div>

    <div class="all-edit-background">
        <div class="add-background">
            <div class="line">
                <h2>Editar</h2>
                <button id="cancel" onclick="toggleEditMenu()">Cancelar</button>
            </div>
            
            <form id="edit-form" class="add-equipment-form">
                <div class="line1">
                    <label for="name" class="line-label">Nome do Equipamento</label>
                    <input id="name" type="text" name="name" placeholder="Digite o nome do equipamento">
                </div>

                <div class="line1">
                    <label for="desc" class="line-label">Descrição</label>
                    <input id="desc" type="text" name="desc" placeholder="Digite a descrição">
                </div>

                <div class="add-div-edit">
                    <button class="cancel-edit" id="delete">Excluir</button>
                    <button class="add-equipment" id="aply" type="submit">Aplicar</button>
                </div>
                
            </form>
        </div>  
    </div>

    <footer>
        <img src="images/Logos - Sistema Fiep RGB_COR_SENAI.png" id="logo">
    </footer>

    <script src="scipts/equipamentos.js"></script>
    <script src="scipts/utils.js"></script>
</body>
</html>
