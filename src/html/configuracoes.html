<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Sistema de Equipamentos</title>
</head>
<body>
    
    <aside>
        <button id="menu-btn"><img src="images/menu.png" height="48px" onclick="menuButton()"></button> <!-- Icone / Botão do menu -->

        <div class="buttons">
            <div class="icone-label">
                <button class="menu-icon"><a href="/dashboard" class="a-menu-icon"><img src="images/home.png" height="48px"></a></button> <!-- Icone / Botão Ínicio -->
                <label id="text-label">Início</label>
            </div>
            
            <div class="icone-label">
                <button  class="menu-icon"><a href="/equipamentos" class="a-menu-icon"><img src="images/laptop-computer.png" height="48px"></a></button> <!-- Icone / Equipamentos -->
                <label id="text-label">Equipamentos</label>
            </div>
            
            <div class="icone-label">
                <button class="menu-icon"><a href="/reservas" class="a-menu-icon"><img src="images/calendar.png" height="48px"></a></button> <!-- Icone / Reservas -->
                <label id="text-label">Reservas</label>
            </div>
            
            <div class="icone-label">
                <button class="menu-icon"><a href="/devolucoes" class="a-menu-icon"><img src="images/return.png" height="48px"></a></button> <!-- Icone / Devoluções -->
                <label id="text-label">Devoluções</label>
            </div>
            
            <div class="icone-label">
                <button class="menu-icon"><a href="/relatorios" class="a-menu-icon"><img src="images/docs.png" height="48px"></a></button> <!-- Icone / Relatórios -->  
                <label id="text-label">Relatórios</label>
            </div>
            
            <div class="icone-label">
                <button class="menu-icon"><a href="/configuracoes" class="a-menu-icon"><img src="images/settings.png" height="48px"></a></button> <!-- Icone / Configurações -->
                <label id="text-label">Configurações</label>
            </div>
            
        </div>

    </aside>

    <div class="background">
        <h1 id="title">Configurações</h1>

        <div class="dalt-mode" id="dalt-mode">
            <label class="title">Modo de Daltonismo</label>
            <div class="in-background">
                <button id="left">&lt;</button>
                <label class="val">Desligado</label>
                <button id="right">&gt;</button>
            </div>
        </div>

        <div class="dalt-mode" id="tema">
            <label class="title">Tema</label>
            <div class="in-background">
                <button id="left">&lt;</button>
                <label class="val">Claro</label>
                <button id="right">&gt;</button>
            </div>
        </div>

        <div class="dalt-mode" id="tema">
            <label class="title">Confirmar Devoluções Automaticamente</label>
            <div class="in-background">
                <button id="left">&lt;</button>
                <label class="val">Não</label>
                <button id="right">&gt;</button>
            </div>
        </div>

    </div>
    
    
    <footer>
        <img src="images/Logos - Sistema Fiep RGB_COR_SENAI.png" id="logo">
    </footer>

    <script src="scipts/config.js"></script>
    <script src="scipts/utils.js"></script>
</body>
</html>
